<!doctype html>
<html lang="en" data-motion="still">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--head-outlet-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/bricolage-var.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function () {
        var d = document.documentElement
        d.classList.add('js')
        var pref = 'on'
        try {
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) pref = 'off'
          var s = localStorage.getItem('motion')
          if (s === 'off' || s === 'on') pref = s
        } catch (e) {}
        d.setAttribute('data-motion', pref === 'off' ? 'still' : 'on')
      })()
    </script>
    <script type="module" src="/src/entry-client.jsx"></script>
  </head>
  <body>
    <div id="root" data-page="<!--page-outlet-->"><!--ssr-outlet--></div>
  </body>
</html>
